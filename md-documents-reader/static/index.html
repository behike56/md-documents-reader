<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown Reader</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f3f5f7;
        color: #172033;
      }
      body { margin: 0; }
      header {
        padding: 1rem 2rem;
        background: #172033;
        color: white;
      }
      header strong { font-size: 1.05rem; }
      main {
        width: min(760px, calc(100% - 2rem));
        margin: 2rem auto;
      }
      article {
        padding: clamp(1.5rem, 4vw, 3rem);
        border: 1px solid #dce1e8;
        border-radius: 12px;
        background: white;
        box-shadow: 0 12px 32px rgb(23 32 51 / 8%);
        line-height: 1.75;
      }
      h1, h2 { line-height: 1.25; }
      h1 { border-bottom: 2px solid #e6eaf0; padding-bottom: 0.5rem; }
      pre {
        overflow-x: auto;
        padding: 1rem;
        border-radius: 8px;
        background: #172033;
        color: #f7f9fc;
      }
      .status { color: #5c667a; }
      .error { color: #a12626; }
    </style>
  </head>
  <body>
    <header><strong>Markdown Reader</strong></header>
    <main>
      <p id="status" class="status">文書を読み込んでいます…</p>
      <article id="document" hidden></article>
    </main>
    <script>
      const status = document.querySelector("#status");
      const documentView = document.querySelector("#document");

      fetch("/api/document")
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((documentData) => {
          document.title = `${documentData.title} | Markdown Reader`;
          documentView.innerHTML = documentData.html;
          documentView.hidden = false;
          status.hidden = true;
        })
        .catch((error) => {
          status.textContent = `文書を読み込めませんでした: ${error.message}`;
          status.classList.add("error");
        });
    </script>
  </body>
</html>
